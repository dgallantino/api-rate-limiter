services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  check:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: check
    ports:
      - "50051:50051"
      - "2112:2112"
    volumes:
      - ./configs/compose/check.yaml:/etc/api-rate-limiter/check.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2112/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  origin:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: origin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 2s
      retries: 10

  origin-limited:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: origin-limited
    ports:
      - "8000:8000"
    environment:
      CHECK_ADDR: check:50051
    depends_on:
      check:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 2s
      retries: 15

  proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: proxy
    ports:
      - "8080:8080"
    volumes:
      - ./configs/compose/proxy.yaml:/etc/api-rate-limiter/proxy.yaml:ro
    depends_on:
      check:
        condition: service_healthy
      origin:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: dashboard
    ports:
      - "8081:8081"
    volumes:
      - ./configs/compose/dashboard.yaml:/etc/api-rate-limiter/dashboard.yaml:ro
    depends_on:
      check:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./configs/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      check:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 2s
      timeout: 2s
      retries: 15

  loadtest:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: loadtest
    profiles: ["load"]
    depends_on:
      proxy:
        condition: service_started
    command: ["loadtest", "-url", "http://proxy:8080/work"]
