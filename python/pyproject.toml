[project]
name = "api-rate-limiter"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["grpcio"]

[project.optional-dependencies]
dev = [
  "grpcio-tools",
  "pytest",
  "httpx",
  "starlette",
  "flask",
  "fastapi",
  "uvicorn",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "gen"]
testpaths = ["tests"]
