<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rate limit stats</title>
  <style>
    :root { color-scheme: dark; }
    body { font: 14px/1.4 system-ui, sans-serif; margin: 1.5rem; background: #111; color: #eee; }
    h1 { font-size: 1.2rem; font-weight: 600; margin: 0 0 1rem; }
    .row { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
    .card { background: #1b1b1b; border: 1px solid #333; border-radius: 6px; padding: .75rem 1rem; min-width: 8rem; }
    .card b { display: block; font-size: 1.4rem; }
    .ok { color: #6d6; }
    .bad { color: #f66; }
    .banner { padding: .75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .banner.down { background: #3a1515; border: 1px solid #a33; }
    .banner.warn { background: #3a2a10; border: 1px solid #a83; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #333; }
    th { color: #aaa; font-weight: 500; }
    .muted { color: #888; }
    h2 { font-size: 1rem; font-weight: 600; margin: 0 0 .75rem; }
    form { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; margin-bottom: 1.25rem; }
    label { display: flex; flex-direction: column; gap: .25rem; color: #aaa; font-size: 12px; }
    input, select, button { font: inherit; background: #1b1b1b; color: #eee; border: 1px solid #333; border-radius: 6px; padding: .4rem .6rem; }
    button { cursor: pointer; }
    #limit-msg { align-self: center; }
  </style>
</head>
<body>
  <h1>Rate limit stats</h1>
  <div id="banner" class="banner" hidden></div>
  <div class="row">
    <div class="card">Redis <b id="redis">—</b></div>
    <div class="card">RPS <b id="rps">—</b></div>
    <div class="card">Allowed <b id="allowed">—</b></div>
    <div class="card">Blocked <b id="blocked">—</b></div>
  </div>
  <h2>Limits</h2>
  <form id="limit-form">
    <label>Rule
      <select id="rule" required></select>
    </label>
    <label>Limit
      <input id="limit" type="number" min="1" step="1" required>
    </label>
    <button type="submit">Update limit</button>
    <span id="limit-msg" class="muted"></span>
  </form>
  <table>
    <thead>
      <tr>
        <th>Key</th>
        <th>Used</th>
        <th>Remaining</th>
        <th>Limit</th>
        <th>Fail</th>
        <th>If Redis down</th>
      </tr>
    </thead>
    <tbody id="keys"></tbody>
  </table>
  <script>
    const banner = document.getElementById("banner");
    const redisEl = document.getElementById("redis");
    const rpsEl = document.getElementById("rps");
    const allowedEl = document.getElementById("allowed");
    const blockedEl = document.getElementById("blocked");
    const keysEl = document.getElementById("keys");
    const form = document.getElementById("limit-form");
    const ruleEl = document.getElementById("rule");
    const limitEl = document.getElementById("limit");
    const limitMsg = document.getElementById("limit-msg");
    let rules = [];

    function ruleLabel(rule) {
      if (rule.target === "default") return "default (" + rule.limit + ")";
      return rule.target + " " + rule.name + " (" + rule.limit + ")";
    }

    function selectedRule() {
      const i = Number(ruleEl.value);
      return rules[i];
    }

    function fillLimit() {
      const rule = selectedRule();
      if (rule) limitEl.value = rule.limit;
    }

    async function loadPolicies() {
      try {
        const r = await fetch("/policies");
        const body = await r.json();
        if (!r.ok) {
          limitMsg.textContent = body.error || "check unreachable";
          limitMsg.className = "bad";
          return;
        }
        const prev = ruleEl.value;
        rules = body.rules || [];
        ruleEl.replaceChildren();
        rules.forEach((rule, i) => {
          const opt = document.createElement("option");
          opt.value = String(i);
          opt.textContent = ruleLabel(rule);
          ruleEl.appendChild(opt);
        });
        if (prev !== "" && rules[Number(prev)]) ruleEl.value = prev;
        fillLimit();
      } catch (e) {
        limitMsg.textContent = "check unreachable";
        limitMsg.className = "bad";
      }
    }

    ruleEl.addEventListener("change", fillLimit);
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const rule = selectedRule();
      if (!rule) return;
      limitMsg.textContent = "";
      try {
        const r = await fetch("/limits", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ target: rule.target, name: rule.name, limit: Number(limitEl.value) }),
        });
        const body = await r.json();
        if (!r.ok) {
          limitMsg.textContent = body.error || "update failed";
          limitMsg.className = "bad";
          return;
        }
        limitMsg.textContent = "limit updated";
        limitMsg.className = "ok";
        await loadPolicies();
      } catch (err) {
        limitMsg.textContent = "check unreachable";
        limitMsg.className = "bad";
      }
    });
    loadPolicies();

    function failAction(fail) {
      return fail === "open" ? "still serving" : "denying";
    }

    function render(s) {
      banner.hidden = true;
      redisEl.textContent = s.redis_up ? "up" : "DOWN";
      redisEl.className = s.redis_up ? "ok" : "bad";
      rpsEl.textContent = s.rps;
      allowedEl.textContent = s.allowed;
      blockedEl.textContent = s.blocked;
      if (!s.redis_up) {
        banner.hidden = false;
        banner.className = "banner down";
        banner.textContent = "Redis is down. Fail-open keys still serve; fail-closed keys deny.";
      }
      const keys = s.keys || [];
      keysEl.replaceChildren();
      for (const k of keys) {
        const tr = document.createElement("tr");
        const action = failAction(k.fail);
        tr.innerHTML = "<td></td><td></td><td></td><td></td><td></td><td></td>";
        const tds = tr.children;
        tds[0].textContent = k.key;
        tds[1].textContent = k.used;
        tds[2].textContent = k.remaining;
        tds[3].textContent = k.limit;
        tds[4].textContent = k.fail;
        tds[5].textContent = action;
        tds[5].className = s.redis_up ? "muted" : (k.fail === "open" ? "ok" : "bad");
        keysEl.appendChild(tr);
      }
    }

    function showUnreachable() {
      banner.hidden = false;
      banner.className = "banner warn";
      banner.textContent = "check unreachable";
      redisEl.textContent = "—";
      redisEl.className = "";
    }

    async function tick() {
      try {
        const r = await fetch("/stats");
        const s = await r.json();
        if (!r.ok) {
          showUnreachable();
          return;
        }
        render(s);
      } catch (e) {
        showUnreachable();
      }
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
